<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Mot de passe oublié</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- CSS global du projet -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <!-- Style local léger pour une carte propre -->
  <style>
    :root{--bg:#f6f9ff;--card:#fff;--txt:#1f2a44;--accent:#005aa3;}
    body{background:var(--bg);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;color:var(--txt);margin:0;}
    header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 20px;border-bottom:1px solid #e6eaf2;background:#fff;}
    .logo-container img{height:40px}
    .container-auth{min-height:calc(100vh - 80px);display:grid;place-items:center;padding:24px;}
    .auth-card{width:100%;max-width:480px;background:var(--card);padding:28px;border-radius:16px;box-shadow:0 6px 24px rgba(0,0,0,.06);}
    .auth-card h2{margin:0 0 6px;}
    .auth-card p.lead{margin:0 0 18px;color:#5b6b82}
    .form-group{display:flex;flex-direction:column;gap:6px;margin:12px 0;}
    .input{padding:12px;border:1px solid #d9e1ec;border-radius:10px;font-size:16px;}
    .btn{display:inline-block;padding:12px 16px;border-radius:10px;border:none;cursor:pointer}
    .btn-primary{background:var(--accent);color:#fff;}
    .btn-secondary{background:#f4f7fb;color:#2b3a55;}
    .actions{display:flex;align-items:center;justify-content:space-between;margin-top:12px;}
    .alert{padding:12px 14px;border-radius:10px;margin:8px 0;font-size:14px;border:1px solid transparent}
    .alert-info{background:#eef6ff;border-color:#d4e8ff;color:#0b4a8c}
    .alert-success{background:#ecfdf5;border-color:#bbf7d0;color:#065f46}
    .alert-warning{background:#fff7ed;border-color:#fed7aa;color:#92400e}
    .alert-danger{background:#fef2f2;border-color:#fecaca;color:#991b1b}
    .small{font-size:12px;color:#6b7280}.alert a.btn-link, .alert a.btn, .alert a {
    overflow-wrap:anywhere; word-break:break-word; display:inline-block;
    }

  </style>
</head>
<body>

<header>
  <div class="logo-container">
    <img src="/image/logo.png" alt="Logo SIPPEREC">
  </div>
  <h1>Réinitialisation</h1>
  <div></div>
</header>

<main class="container-auth">
  <section class="auth-card">
    <h2>Mot de passe oublié</h2>
    <p class="lead">Saisis ton identifiant. Si un compte existe, un lien de réinitialisation sera généré.</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for cat,msg in messages %}
            <div class="alert alert-{{cat}}">{{ msg|safe }}</div>
        {% endfor %}
    {% endwith %}


    <form method="post" novalidate>
      <div class="form-group">
        <label for="username"><strong>Identifiant</strong></label>
        <input id="username" name="username" class="input" autocomplete="username" required>
      </div>

      <div class="actions">
        <a class="btn btn-secondary" href="{{ url_for('login') }}">Retour</a>
        <button type="submit" class="btn btn-primary">Envoyer le lien</button>
      </div>
    </form>
  </section>
</main>

</body>
</html>
